[package]
name = "mai-schedule"
version = "2.0.0"
edition = "2024"
rust-version = "1.85"
description = "CLI and TUI for the MAI student schedule"
license = "GPL-3.0-or-later"

[dependencies]
chrono = { version = "0.4.42", features = ["clock", "serde"] }
md5 = "0.8.0"
reqwest = { version = "0.12.24", default-features = false, features = ["blocking", "rustls-tls"] }
scraper = "0.24.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
terminalib = { git = "https://github.com/acup1/terminalib.git", rev = "02753b98a940111464a1ba30b54ece1eb67b5167" }
url = "2.5.7"

[profile.release]
strip = true
lto = true
codegen-units = 1
