[package]
name = "mai-schedule"
version = "2.0.0"
edition = "2024"
rust-version = "1.85"
description = "CLI and TUI for the MAI student schedule"
license = "GPL-3.0-or-later"

[dependencies]
chrono = { version = "0.4.42", features = ["clock", "serde"] }
md5 = "0.8.0"
reqwest = { version = "0.12.24", default-features = false, features = ["blocking", "rustls-tls"] }
scraper = "0.24.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
termutils = { git = "https://github.com/acup1/termutils.git", rev = "3f199a22a8c4f13e89dc7cb144e896a9d1998dc4" }
url = "2.5.7"

[profile.release]
strip = true
lto = true
codegen-units = 1
